<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLV Cleaning Services - Invoice Generator</title>
    <!-- Chrome stamps this favicon on the shortcut the client creates from the
         page, so it is the SLV logo rather than a generic document icon. -->
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <img class="topbar-logo" src="assets/logo.png" alt="SLV Cleaning Services" />
      <div class="topbar-text">
        <strong>SLV Cleaning Services</strong>
        <span>Invoice Generator</span>
      </div>
    </header>

    <main id="app"></main>

    <!--
      Plain <script> tags, not modules: Chrome blocks type="module" on file:// URLs,
      and this page is opened straight off the disk. Load order matters - every file
      hangs itself off the shared window.SLV namespace and reads the ones before it.
    -->
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="vendor/jspdf.plugin.autotable.min.js"></script>
    <script src="vendor/exceljs.min.js"></script>

    <script src="js/logoData.js"></script>
    <script src="js/models.js"></script>
    <script src="js/dateInput.js"></script>
    <script src="js/invoiceBuilder.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/pdfGenerator.js"></script>
    <script src="js/excelGenerator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
